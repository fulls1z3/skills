name: release

on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/plugin.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          version=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          market=$(python3 -c 'import json; print(json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"])')
          if [ "$version" != "$market" ]; then
            echo "plugin.json ($version) and marketplace.json ($market) differ" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, nothing to do"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
